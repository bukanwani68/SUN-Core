<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUN-Core - Login Portal Internal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col justify-center items-center p-4">

    <div class="bg-slate-800 text-slate-100 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700/50 transition-all duration-300">
        
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-amber-500 text-slate-950 text-2xl font-black mb-3 shadow-lg shadow-amber-500/20">
                SUN
            </div>
            <h1 class="text-2xl font-bold tracking-tight">SUN-Core Platform</h1>
            <p class="text-slate-400 text-sm mt-1">Operations & Financial Integrated Hub</p>
            <div class="mt-2 inline-block bg-slate-700/50 text-slate-300 text-xs px-2.5 py-1 rounded-full border border-slate-600/30">
                <i class="fa-solid fa-lock text-amber-400 mr-1"></i> Portal Internal PT SUN Distribution
            </div>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username / Role ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" id="username" required 
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all placeholder:text-slate-600" 
                        placeholder="Masukkan ID Jabatan Anda">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                        <i class="fa-solid fa-key text-sm"></i>
                    </span>
                    <input type="password" id="password" required 
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 text-sm transition-all placeholder:text-slate-600" 
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold rounded-xl shadow-lg shadow-amber-500/10 hover:shadow-amber-500/20 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer mt-2 text-sm">
                Masuk Sistem <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="relative my-6 text-center">
            <span class="absolute inset-x-0 top-1/2 h-px bg-slate-700"></span>
            <span class="relative bg-slate-800 px-3 text-xs text-slate-500 uppercase tracking-widest font-medium">Demo Quick Login</span>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
            <button onclick="quickLogin('admin_sales', 'dashboard-sales.html')" 
                class="p-2.5 bg-slate-900/40 hover:bg-slate-700/50 border border-slate-700/60 hover:border-slate-600 rounded-xl transition-all text-left flex items-center gap-2 cursor-pointer group">
                <div class="w-7 h-7 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-slate-950 transition-all"><i class="fa-solid fa-cart-shopping"></i></div>
                <div>
                    <p class="font-semibold text-slate-200">Sales Admin</p>
                    <p class="text-[10px] text-slate-500">Input Order</p>
                </div>
            </button>

            <button onclick="quickLogin('admin_warehouse', 'dashboard-warehouse.html')" 
                class="p-2.5 bg-slate-900/40 hover:bg-slate-700/50 border border-slate-700/60 hover:border-slate-600 rounded-xl transition-all text-left flex items-center gap-2 cursor-pointer group">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-slate-950 transition-all"><i class="fa-solid fa-warehouse"></i></div>
                <div>
                    <p class="font-semibold text-slate-200">Warehouse</p>
                    <p class="text-[10px] text-slate-500">PGI & Stok</p>
                </div>
            </button>

            <button onclick="quickLogin('admin_procurement', 'dashboard-procurement.html')" 
                class="p-2.5 bg-slate-900/40 hover:bg-slate-700/50 border border-slate-700/60 hover:border-slate-600 rounded-xl transition-all text-left flex items-center gap-2 cursor-pointer group">
                <div class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center group-hover:bg-purple-500 group-hover:text-slate-950 transition-all"><i class="fa-solid fa-truck-ramp-box"></i></div>
                <div>
                    <p class="font-semibold text-slate-200">Procurement</p>
                    <p class="text-[10px] text-slate-500">Beli Supplier</p>
                </div>
            </button>

            <button onclick="quickLogin('admin_finance', 'dashboard-finance.html')" 
                class="p-2.5 bg-slate-900/40 hover:bg-slate-700/50 border border-slate-700/60 hover:border-slate-600 rounded-xl transition-all text-left flex items-center gap-2 cursor-pointer group">
                <div class="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center group-hover:bg-rose-500 group-hover:text-slate-950 transition-all"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                <div>
                    <p class="font-semibold text-slate-200">Finance</p>
                    <p class="text-[10px] text-slate-500">Invoice & Cash</p>
                </div>
            </button>

            <button onclick="quickLogin('director_sun', 'dashboard-management.html')" 
                class="col-span-2 p-2.5 bg-slate-900/40 hover:bg-amber-500/10 border border-slate-700/60 hover:border-amber-500/30 rounded-xl transition-all text-center flex items-center justify-center gap-2 cursor-pointer group">
                <div class="w-7 h-7 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center group-hover:bg-amber-500 group-hover:text-slate-950 transition-all"><i class="fa-solid fa-chart-pie"></i></div>
                <p class="font-semibold text-slate-200 group-hover:text-amber-400 transition-all">Direktur / Management (Dashboard KPI)</p>
            </button>
        </div>
    </div>

    <p class="text-slate-600 text-xs mt-8 font-medium">© 2026 PT Segar Utama Nusantara. Project EAS Digital Transformation.</p>

    <script>
        // Data akun untuk simulasi login manual
        const accounts = {
            'admin_sales': 'dashboard-sales.html',
            'admin_warehouse': 'dashboard-warehouse.html',
            'admin_procurement': 'dashboard-procurement.html',
            'admin_finance': 'dashboard-finance.html',
            'director_sun': 'dashboard-management.html'
        };

        // Fungsi ketika form di-submit manual
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            
            if (accounts[user]) {
                // Simpan session role yang aktif
                sessionStorage.setItem('currentRole', user);
                window.location.href = accounts[user];
            } else {
                alert('Username tidak terdaftar! Gunakan bantuan "Demo Quick Login" di bawah.');
            }
        });

        // Fungsi klik otomatis quick login
        function quickLogin(username, targetUrl) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = 'password123';
            
            // Beri delay sedikit demi efek visual sebelum pindah halaman
            setTimeout(() => {
                sessionStorage.setItem('currentRole', username);
                window.location.href = targetUrl;
            }, 250);
        }

        // Inisialisasi basis data awal fiktif di localStorage jika belum ada
        // Ini agar modul-modul lain langsung memiliki data awal saat pertama dibuka
        if (!localStorage.getItem('sun_orders')) {
            const initialOrders = [
                { id: "SO-2026-001", customer: "Resto Padang Merdeka", type: "B2B (WhatsApp)", product: "Daging Sapi Slice 10kg", total: 1200000, status: "Selesai", date: "2026-06-23" },
                { id: "SO-2026-002", customer: "Budi Santoso (Shopee)", type: "B2C (E-Commerce)", product: "Chicken Nugget Premium 1kg", total: 45000, status: "Dalam Pengiriman", date: "2026-06-24" },
                { id: "SO-2026-003", customer: "Cafe Lawrence", type: "B2B (WhatsApp)", product: "Kentang Goreng Beku 20kg", total: 650000, status: "Menunggu Gudang", date: "2026-06-25" }
            ];
            localStorage.setItem('sun_orders', JSON.stringify(initialOrders));
        }

        if (!localStorage.getItem('sun_stock')) {
            const initialStock = {
                'daging': { name: 'Daging Sapi Slice', qty: 150, unit: 'kg', min: 50 },
                'nugget': { name: 'Chicken Nugget Premium', qty: 300, unit: 'pack', min: 80 },
                'kentang': { name: 'Kentang Goreng Beku', qty: 40, unit: 'bag', min: 60 } // Di bawah batas minimum
            };
            localStorage.setItem('sun_stock', JSON.stringify(initialStock));
        }
    </script>
</body>
</html>
